<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Habit Tracker</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h2>
					How are you today?
					<button id="selectEmojiBtn">⨁</button>
				</h2>
				<div class="popup" id="emojiPopup">
					<div class="popup-content">
						<div class="popup-emoji">😊</div>
						<div class="popup-emoji">😐</div>
						<div class="popup-emoji">😢</div>
						<div class="popup-emoji">😃</div>
						<div class="popup-emoji">😡</div>
					</div>
				</div>
			</div>

			<div class="calendar">
				<div class="day"><span class="date">1</span><span class="day-name">MON</span></div>
				<div class="day"><span class="date">2</span><span class="day-name">TUE</span></div>
				<div class="day"><span class="date">3</span><span class="day-name">WED</span></div>
				<div class="day"><span class="date">4</span><span class="day-name">THU</span></div>
				<div class="day"><span class="date">5</span><span class="day-name">FRI</span></div>
				<div class="day"><span class="date">6</span><span class="day-name">SAT</span></div>
				<div class="day"><span class="date">7</span><span class="day-name">SUN</span></div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
